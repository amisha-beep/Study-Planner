<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Planner</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    transition: 0.3s;
}

.container {
    background: white;
    padding: 25px;
    width: 400px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #5a67d8;
}

button:active {
    transform: scale(0.95);
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #f9f9f9;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.3s;
}

li:hover {
    transform: translateY(-2px);
}

.task-text {
    flex: 1;
}

.btn {
    padding: 5px 8px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
}

.edit {
    background: orange;
    color: white;
}

.delete {
    background: red;
    color: white;
}

/* 🌙 DARK MODE */
.dark {
    background: #1a202c;
}

.dark .container {
    background: #2d3748;
    color: white;
}

.dark li {
    background: #4a5568;
}

/* 🔔 TOAST */
#toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h2>📚 Study Planner</h2>

    <button onclick="toggleDarkMode()">🌙 Toggle Mode</button>

    <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchTasks()">

    <input type="text" id="taskInput" placeholder="Enter task">
    <input type="date" id="dateInput">

    <select id="priorityInput">
        <option value="Low">Low Priority</option>
        <option value="Medium">Medium Priority</option>
        <option value="High">High Priority</option>
    </select>

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

</div>

<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
