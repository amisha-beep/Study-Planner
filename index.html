<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 60%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #5a67d8;
    }

    .clear {
      background: red;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .task-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 8px;
      cursor: pointer;
    }

    .date {
      font-size: 12px;
      color: gray;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📚 Study Planner</h1>

  <input type="text" id="taskInput" placeholder="Enter task">
  <button onclick="addTask()">Add</button>
  <button class="clear" onclick="clearTasks()">Clear All</button>

  <ul id="taskList"></ul>
</div>

<script>
  const API = "https://study-planner-backend-p03g.onrender.com"; 

  async function fetchTasks() {
    const res = await fetch(API);
    const data = await res.json();

    const list = document.getElementById("taskList");
    list.innerHTML = "";

    data.forEach(task => {
      const li = document.createElement("li");

      li.innerHTML = `
        <div class="task-row">
          <div>
            <input type="checkbox" onchange="toggleComplete(this)">
            <span>${task.text}</span>
          </div>
          <button class="delete" onclick="deleteTask('${task._id}')">X</button>
        </div>
        <div class="date">${new Date().toLocaleString()}</div>
      `;

      list.appendChild(li);
    });
  }

  function toggleComplete(checkbox) {
    const text = checkbox.nextElementSibling;
    text.classList.toggle("completed");
  }

  async function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value;

    if (!text) return;

    await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    input.value = "";
    fetchTasks();
  }

  async function deleteTask(id) {
    await fetch(API + "/" + id, {
      method: "DELETE"
    });

    fetchTasks();
  }

  async function clearTasks() {
    const res = await fetch(API);
    const data = await res.json();

    for (let task of data) {
      await fetch(API + "/" + task._id, {
        method: "DELETE"
      });
    }

    fetchTasks();
  }

  fetchTasks();
</script>

</body>
</html>
